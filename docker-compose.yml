version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: foodbridge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=prod-secret-foodbridge-jwt-token-key-2026
      - DATABASE_URL=sqlite:///./foodbridge.db
      - GEMINI_API_KEY=
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: foodbridge_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:

